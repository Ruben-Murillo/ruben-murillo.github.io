name: Migrate Wix media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_wix_media.py'
      - '.github/workflows/migrate-wix-media.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download Wix media into repository
        run: python scripts/migrate_wix_media.py
      - name: Commit downloaded media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            echo "No new media to commit."
          else
            git commit -m "Migrate Wix media into portfolio"
            git push
          fi
